
<!DOCTYPE html>
<html lang="ko">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울 도로교통 뉴스 브리핑</title>

    <style>
        body {
            margin: 0;
            background-color: #f3f5f9;
            color: #172033;

        }

        .container {

        .site-title {
            color: #2563eb;
            font-weight: bold;
        }

        h1 {
            font-size: 30px;
            line-height: 1.5;
        }

        .lead {
            font-size: 19px;
            font-weight: bold;
            line-height: 1.8;
        }

        .article-body {
            white-space: pre-line;
            line-height: 2;
            font-size: 16px;
        }

        .notice {
            margin-top: 30px;
            padding: 18px;
            background-color: #f1f5f9;
            line-height: 1.7;
            color: #475569;
        }

        button {
            padding: 12px 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: wait;
        }

        .navigation {
            margin-bottom: 25px;
        }

        .navigation a {
            margin-right: 20px;
            color: #2563eb;
        }

        #newsStatus {
            margin-top: 16px;
            color: #475569;
        }
        
.news-time {
    font-size: 14px;
    color: #64748b;
    margin-top: 8px;
    margin-bottom: 24px;
}


/* 교통정보 대시보드 */
.dashboard {
    margin-top: 30px;
    margin-bottom: 35px;
}

.summary-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 30px;
}

.summary-card {
    padding: 20px;
    background-color: #f1f5f9;
    border-radius: 10px;
}

.summary-card p {
    color: #64748b;
    font-size: 13px;
    margin-top: 0;
}

.summary-card strong {
    font-size: 28px;
    color: #172033;
}

/* 경로별 비교 그래프 */
.chart-item {
    margin-bottom: 22px;
}

.chart-label {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    font-size: 14px;
}

.chart-track {
    height: 15px;
    background-color: #e2e8f0;
    border-radius: 8px;
    overflow: hidden;
}

.chart-bar {
    height: 100%;
    background-color: #2563eb;
    border-radius: 8px;
}

.chart-notice {
    font-size: 13px;
    color: #64748b;
    line-height: 1.7;
}

/* 모바일 화면 대응 */
@media (max-width: 650px) {
    .summary-cards {
        grid-template-columns: 1fr;
    }

    .container {
        margin: 10px;
        padding: 20px;
    }

    h1 {
        font-size: 24px;
    }
}

/* 저장된 뉴스 목록 */
.history-section {
    margin-top: 30px;
    margin-bottom: 30px;
}

.history-item {
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 15px;
    margin-top: 12px;
}

.history-date {
    color: #64748b;
    font-size: 13px;
    margin-bottom: 8px;
}

.history-title {
    display: block;
    font-weight: bold;
    line-height: 1.6;
    margin-bottom: 12px;
}

.history-item button {
    padding: 8px 12px;
    font-size: 13px;
}

#historyStatus {
    color: #475569;
    font-size: 14px;
}

    </style>
    <link rel="stylesheet" href="/static/navigation.css">
    <script src="/static/navigation.js" defer></script>
</head>

<body>
    <nav id="sharedNavigation" aria-label="주요 메뉴"></nav>
    <main class="container">



        <p class="site-title">SEOUL TRAFFIC NEWS</p>

        <h2>서울 도로교통 뉴스 브리핑</h2>

        <button
            type="button"
            id="loadNewsButton"
            onclick="loadTrafficNews()"
        >
            최신 경로정보 조회 및 뉴스 생성
        </button>

        <p id="newsStatus" role="status">
            버튼을 누르면 교통정보를 조회합니다.
        </p>

<!-- 과거 뉴스 조회 -->
<section class="history-section" id="historySection">

    <h2>저장된 교통 뉴스</h2>

    <button
        type="button"
        id="loadHistoryButton"
        onclick="loadNewsHistory()"
    >
        저장된 뉴스 목록 불러오기
    </button>

    <p id="historyStatus" role="status"></p>

    <div id="historyList"></div>

</section>

        <hr>

        
<!-- 교통정보 핵심 지표 -->
<section id="trafficDashboard" class="dashboard">
    <h2>주요 경로 교통 현황</h2>

    <div class="summary-cards">

        <div class="summary-card">
            <p>분석 경로</p>
            <strong id="routeCount">-</strong>
        </div>

        <div class="summary-card">
            <p>최고 정체·지체 거리 비율</p>
            <strong id="highestRatio">-</strong>
        </div>

        <div class="summary-card">
            <p>해당 경로 정체·지체 구간</p>
            <strong id="highestCongestedCount">-</strong>
        </div>

    </div>

    <h3>경로별 정체·지체 거리 비율</h3>

    <div id="routeChart">
        조회 버튼을 누르면 비교 그래프가 표시됩니다.
    </div>

    <p class="chart-notice">
        정체·지체 거리 비율은 해당 자동차 경로의
        전체 거리 대비 정체·지체 구간 거리의 비율입니다.
        전체 교통 혼잡도를 의미하지는 않습니다.
    </p>
</section>


        <article>
            <h1 id="newsTitle">
                아직 생성된 뉴스가 없습니다.
            </h1>
            
<p id="newsRetrievedAt" class="news-time">
    교통정보 조회 전입니다.
</p>


            <p id="newsLead" class="lead"></p>

            <div id="newsBody" class="article-body"></div>

            <p class="notice" id="newsNotice"></p>
        </article>

    </main>

    <script>
        async function loadTrafficNews() {

            const newsButton = document.getElementById(
                "loadNewsButton"
            );

            const newsStatus = document.getElementById(
                "newsStatus"
            );

            const newsTitle = document.getElementById(
                "newsTitle"
            );
            
            const newsRetrievedAt = document.getElementById(
            "newsRetrievedAt"
            );

            const newsLead = document.getElementById(
                "newsLead"
            );

            const newsBody = document.getElementById(
                "newsBody"
            );

            const newsNotice = document.getElementById(
                "newsNotice"
            );

            newsButton.disabled = true;
            newsStatus.textContent = "교통정보를 조회하고 있습니다.";

            try {
                const response = await fetch(
                    "/api/briefing/news"
                );

                const newsData = await response.json();

                if (!response.ok) {
                    throw new Error(
                        typeof newsData.detail === "string"
                            ? newsData.detail
                            : "뉴스 조회에 실패했습니다."
                    );
                }

                // 데이터를 HTML이 아닌 일반 텍스트로 출력
                newsTitle.textContent = newsData.title;
                newsLead.textContent = newsData.lead;
                newsBody.textContent = newsData.body;
                newsNotice.textContent = newsData.scope_notice;
                displayTrafficDashboard(newsData.routes);
                
// 서버에서 전달받은 조회 완료 시각 표시
if (newsData.retrieved_at) {

    const retrievedDate = new Date(
        newsData.retrieved_at
    );

    newsRetrievedAt.textContent =
        "교통정보 조회 완료: " +
        retrievedDate.toLocaleString("ko-KR", {
            timeZone: "Asia/Seoul",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
        }) +
        " (KST)";

} else {

    newsRetrievedAt.textContent =
        "조회 완료 시각 정보가 없습니다.";

}

                newsStatus.textContent =
                    "조회 완료: " +
                    newsData.analyzed_route_count +
                    "개 경로 분석";

            } catch (error) {

                newsStatus.textContent =
                    "오류: " + error.message;

            } finally {

                newsButton.disabled = false;

            }
        }
        
// 교통정보 대시보드 표시 함수
function displayTrafficDashboard(routes) {

    const routeCount = document.getElementById("routeCount");

    const highestRatio = document.getElementById("highestRatio");

    const highestCongestedCount = document.getElementById(
        "highestCongestedCount"
    );

    const routeChart = document.getElementById("routeChart");

    // 1. 분석 경로 수 표시
    routeCount.textContent = routes.length + "개";

    // 2. 경로별 정체·지체 거리 비율 계산
    const chartData = [];

    routes.forEach(function (route) {

        const distance = route.distance_m;
        const congestedDistance = route.congested_distance_m;

        // 거리 정보가 올바르지 않으면 비교에서 제외
        if (
            distance == null ||
            distance <= 0 ||
            congestedDistance == null ||
            congestedDistance < 0 ||
            congestedDistance > distance
        ) {
            return;
        }

        const ratio = congestedDistance / distance * 100;

        chartData.push({
            name: route.start + " → " + route.end,
            ratio: ratio,
            congestedCount: route.congested_count
        });

    });

    // 3. 정체·지체 거리 비율이 높은 순서로 정렬
    chartData.sort(function (first, second) {
        return second.ratio - first.ratio;
    });

    // 조회된 경로 중 비교 가능한 데이터가 없는 경우
    if (chartData.length === 0) {

        highestRatio.textContent = "정보 없음";
        highestCongestedCount.textContent = "정보 없음";

        routeChart.textContent =
            "비교 가능한 경로 거리 정보가 없습니다.";

        return;
    }

    // 4. 가장 높은 정체·지체 거리 비율 표시
    const highestRoute = chartData[0];

    highestRatio.textContent =
        highestRoute.ratio.toFixed(1) + "%";

    highestCongestedCount.textContent =
        highestRoute.congestedCount + "개";

    // 5. 기존 그래프 제거
    routeChart.replaceChildren();

    // 6. 경로별 막대그래프 생성
    chartData.forEach(function (route) {

        const chartItem = document.createElement("div");
        chartItem.className = "chart-item";

        const chartLabel = document.createElement("div");
        chartLabel.className = "chart-label";

        const routeName = document.createElement("span");
        routeName.textContent = route.name;

        const ratioText = document.createElement("strong");
        ratioText.textContent = route.ratio.toFixed(1) + "%";

        chartLabel.appendChild(routeName);
        chartLabel.appendChild(ratioText);

        // 그래프 배경
        const chartTrack = document.createElement("div");
        chartTrack.className = "chart-track";

        // 그래프 막대
        const chartBar = document.createElement("div");
        chartBar.className = "chart-bar";

        // 100%를 전체 막대 너비로 사용
        chartBar.style.width = route.ratio + "%";

        chartTrack.appendChild(chartBar);

        chartItem.appendChild(chartLabel);
        chartItem.appendChild(chartTrack);

        routeChart.appendChild(chartItem);

    });
}

// Supabase에 저장된 뉴스 목록 조회
async function loadNewsHistory() {

    const historyButton = document.getElementById(
        "loadHistoryButton"
    );

    const historyStatus = document.getElementById(
        "historyStatus"
    );

    const historyList = document.getElementById(
        "historyList"
    );

    historyButton.disabled = true;
    historyStatus.textContent = "저장된 뉴스를 불러오는 중입니다.";

    try {

        const response = await fetch("/api/news/history");

        const historyData = await response.json();

        if (!response.ok) {
            throw new Error(
                typeof historyData.detail === "string"
                    ? historyData.detail
                    : "뉴스 목록 조회 실패"
            );
        }

        // 이전 목록 제거
        historyList.replaceChildren();

        if (historyData.articles.length === 0) {
            historyStatus.textContent = "저장된 뉴스가 없습니다.";
            return;
        }

        // 각 기사의 제목과 조회 시각 표시
        historyData.articles.forEach(function (article) {

            const item = document.createElement("div");
            item.className = "history-item";

            const dateText = document.createElement("p");
            dateText.className = "history-date";

            const articleDate = new Date(article.retrieved_at);

            dateText.textContent =
                "기사 #" + article.id + " · " +
                articleDate.toLocaleString("ko-KR", {
                    timeZone: "Asia/Seoul"
                });

            const title = document.createElement("span");
            title.className = "history-title";
            title.textContent = article.title;

            const viewButton = document.createElement("button");
            viewButton.type = "button";
            viewButton.textContent = "이 기사 읽기";

            viewButton.addEventListener("click", function () {
                loadSavedNews(article.id);
            });

            item.appendChild(dateText);
            item.appendChild(title);
            item.appendChild(viewButton);

            historyList.appendChild(item);
        });

        historyStatus.textContent =
            "저장된 뉴스 " + historyData.count + "건을 불러왔습니다.";

    } catch (error) {

        historyStatus.textContent =
            "오류: " + error.message;

    } finally {

        historyButton.disabled = false;

    }
}


// 선택한 과거 뉴스 상세 조회
async function loadSavedNews(articleId) {

    const newsStatus = document.getElementById("newsStatus");

    newsStatus.textContent =
        "저장된 기사 #" + articleId + "을 불러오는 중입니다.";

    try {

        const response = await fetch(
            "/api/news/history/" + articleId
        );

        const article = await response.json();

        if (!response.ok) {
            throw new Error(
                typeof article.detail === "string"
                    ? article.detail
                    : "기사 상세 조회 실패"
            );
        }

        // 기존 뉴스 기사 영역에 저장된 기사 표시
        document.getElementById("newsTitle").textContent =
            article.title;

        document.getElementById("newsLead").textContent =
            article.lead;

        document.getElementById("newsBody").textContent =
            article.body;

        document.getElementById("newsNotice").textContent =
            article.scope_notice;

        // 과거 조회 완료 시각 표시
        const retrievedDate = new Date(article.retrieved_at);

        document.getElementById("newsRetrievedAt").textContent =
            "과거 교통정보 조회 완료: " +
            retrievedDate.toLocaleString("ko-KR", {
                timeZone: "Asia/Seoul",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            }) + " (KST)";

        // 저장된 경로 데이터로 기존 그래프 다시 그리기
        displayTrafficDashboard(article.routes);

        newsStatus.textContent =
            "저장된 기사 #" + article.id +
            " · 과거 기록 조회 완료";

        // 기사 영역으로 이동
        document.getElementById("newsTitle").scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    } catch (error) {

        newsStatus.textContent =
            "오류: " + error.message;

    }
}

    </script>
