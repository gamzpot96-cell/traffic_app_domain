
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울 도로교통 뉴스 브리핑</title>

    <style>
        body {
            margin: 0;
            background-color: #f3f5f9;
            color: #172033;
            font-family: Arial, "Malgun Gothic", sans-serif;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 36px;
            background-color: white;
            border-radius: 12px;
        }

        .site-title {
            color: #2563eb;
            font-weight: bold;
        }

        h1 {
            font-size: 30px;
            line-height: 1.5;
        }

        .lead {
            font-size: 19px;
            font-weight: bold;
            line-height: 1.8;
        }

        .article-body {
            white-space: pre-line;
            line-height: 2;
            font-size: 16px;
        }

        .notice {
            margin-top: 30px;
            padding: 18px;
            background-color: #f1f5f9;
            line-height: 1.7;
            color: #475569;
        }

        button {
            padding: 12px 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: wait;
        }

        .navigation {
            margin-bottom: 25px;
        }

        .navigation a {
            margin-right: 20px;
            color: #2563eb;
        }

        #newsStatus {
            margin-top: 16px;
            color: #475569;
        }
    </style>
</head>

<body>
    <main class="container">

        <nav class="navigation">
            <a href="/">홈</a>
            <a href="/map">교통 지도</a>
        </nav>

        <p class="site-title">SEOUL TRAFFIC NEWS</p>

        <h2>서울 도로교통 뉴스 브리핑</h2>

        <button
            type="button"
            id="loadNewsButton"
            onclick="loadTrafficNews()"
        >
            최신 경로정보 조회 및 뉴스 생성
        </button>

        <p id="newsStatus" role="status">
            버튼을 누르면 교통정보를 조회합니다.
        </p>

        <hr>

        <article>
            <h1 id="newsTitle">
                아직 생성된 뉴스가 없습니다.
            </h1>

            <p id="newsLead" class="lead"></p>

            <div id="newsBody" class="article-body"></div>

            <p class="notice" id="newsNotice"></p>
        </article>

    </main>

    <script>
        async function loadTrafficNews() {

            const newsButton = document.getElementById(
                "loadNewsButton"
            );

            const newsStatus = document.getElementById(
                "newsStatus"
            );

            const newsTitle = document.getElementById(
                "newsTitle"
            );

            const newsLead = document.getElementById(
                "newsLead"
            );

            const newsBody = document.getElementById(
                "newsBody"
            );

            const newsNotice = document.getElementById(
                "newsNotice"
            );

            newsButton.disabled = true;
            newsStatus.textContent = "교통정보를 조회하고 있습니다.";

            try {
                const response = await fetch(
                    "/api/briefing/news"
                );

                const newsData = await response.json();

                if (!response.ok) {
                    throw new Error(
                        typeof newsData.detail === "string"
                            ? newsData.detail
                            : "뉴스 조회에 실패했습니다."
                    );
                }

                // 데이터를 HTML이 아닌 일반 텍스트로 출력
                newsTitle.textContent = newsData.title;
                newsLead.textContent = newsData.lead;
                newsBody.textContent = newsData.body;
                newsNotice.textContent = newsData.scope_notice;

                newsStatus.textContent =
                    "조회 완료: " +
                    newsData.analyzed_route_count +
                    "개 경로 분석";

            } catch (error) {

                newsStatus.textContent =
                    "오류: " + error.message;

            } finally {

                newsButton.disabled = false;

            }
        }
    </script>
</body>
</html>
