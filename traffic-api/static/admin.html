
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>관리자 로그인 - 서울 교통 뉴스</title>

    <style>
        body {
            margin: 0;
            background-color: #f3f5f9;
            color: #172033;
            font-family: Arial, "Malgun Gothic", sans-serif;
        }

        body.admin-active .login-container { max-width: 900px; }

        .login-container {
            max-width: 420px;
            margin: 80px auto;
            padding: 35px;
            background-color: white;
            border-radius: 12px;
        }

        .site-title {
            color: #2563eb;
            font-weight: bold;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:disabled {
            background-color: #94a3b8;
        }

        .message {
            margin-top: 20px;
            line-height: 1.6;
        }

        .admin-panel {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background-color: #f1f5f9;
            border-radius: 8px;
        }

        .draft-preview { margin-top: 20px; padding: 18px; background: white; border-radius: 8px; }
        .draft-preview h3 { line-height: 1.5; }
        .draft-preview p { line-height: 1.8; white-space: pre-line; }
        .draft-preview table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .draft-preview th, .draft-preview td { padding: 9px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .draft-preview .table-scroll { overflow-x: auto; }
        .draft-preview .small-note { font-size: 13px; color: #64748b; }
        .draft-actions { display: flex; gap: 12px; flex-wrap: wrap; }
        .draft-actions button { width: auto; margin-top: 12px; }
        .draft-actions .secondary { background: #475569; }
        @media(max-width:600px) { .login-container { margin: 12px; padding: 20px; } }
        .navigation {
            margin-top: 25px;
        }

        .navigation a {
            color: #2563eb;
            margin-right: 15px;
        }
    </style>
    <link rel="stylesheet" href="/static/navigation.css">
    <script src="/static/navigation.js" defer></script>
</head>

<body>
    <nav id="sharedNavigation" aria-label="주요 메뉴"></nav>
    <main class="login-container">

        <p class="site-title">SEOUL TRAFFIC NEWS</p>

        <h1>관리자 로그인</h1>

        <p>교통 뉴스 저장 및 관리를 위한 인증 페이지입니다.</p>

        <form id="loginForm">

            <label for="adminEmail">이메일</label>
            <input
                type="email"
                id="adminEmail"
                autocomplete="username"
                required
            >

            <label for="adminPassword">비밀번호</label>
            <input
                type="password"
                id="adminPassword"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                로그인
            </button>

        </form>

        <p id="loginMessage" class="message" role="status"></p>

        <section id="adminPanel" class="admin-panel">
            <h2>관리자 인증 완료</h2>
            <p>관리자 계정으로 로그인했습니다.</p>
            <p>먼저 기사를 생성하고 내용을 확인한 후 저장하세요.</p>
            <div class="draft-actions">
                <button type="button" id="generateDraftButton">
                    새 교통 뉴스 생성
                </button>
                <button type="button" id="saveDraftButton" disabled>
                    확인한 뉴스 저장
                </button>
                <button type="button" id="logoutButton" class="secondary">
                    로그아웃
                </button>
            </div>
            <p id="draftStatus" class="message" role="status">
                아직 생성된 기사가 없습니다.
            </p>
            <div id="draftPreview" class="draft-preview" hidden>
                <h3 id="draftTitle"></h3>
                <p id="draftRetrievedAt" class="small-note"></p>
                <p id="draftLead"></p>
                <p id="draftBody"></p>
                <p id="draftNotice" class="small-note"></p>
                <h3>경로별 분석 데이터</h3>
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr><th>경로</th><th>거리(km)</th><th>시간(분)</th><th>정체·지체 비율</th></tr>
                        </thead>
                        <tbody id="draftRoutes"></tbody>
                    </table>
                </div>
            </div>
            <p id="savedArticleLink"></p>

            <!-- 인증 완료 후 위의 기사 작업실을 사용합니다. -->
 
        </section>



    </main>

    <script>
        // 인증 토큰은 브라우저 메모리에만 저장
        let adminAccessToken = null;
        let pendingDraftToken = null;

        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const loginMessage = document.getElementById("loginMessage");
        const adminPanel = document.getElementById("adminPanel");
        const logoutButton = document.getElementById("logoutButton");

        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const email = document.getElementById(
                "adminEmail"
            ).value;

            const passwordInput = document.getElementById(
                "adminPassword"
            );

            loginButton.disabled = true;
            loginMessage.textContent = "관리자 로그인 확인 중입니다.";

            try {

                // 1. 로그인 API 호출
                const loginResponse = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: passwordInput.value
                    })
                });

                const loginData = await loginResponse.json();

                if (!loginResponse.ok) {
                    throw new Error(
                        typeof loginData.detail === "string"
                            ? loginData.detail
                            : "로그인에 실패했습니다."
                    );
                }

                // 로그인에 사용한 비밀번호 입력값 지우기
                passwordInput.value = "";

                // 2. 인증 토큰을 임시로 보관
                adminAccessToken = loginData.access_token;

                // 3. FastAPI에서 관리자 권한 재확인
                const verifyResponse = await fetch("/api/admin/me", {
                    headers: {
                        "Authorization": "Bearer " + adminAccessToken
                    }
                });

                if (!verifyResponse.ok) {
                    throw new Error("관리자 권한을 확인하지 못했습니다.");
                }

                const verifyData = await verifyResponse.json();

                if (!verifyData.authenticated || !verifyData.is_admin) {
                    throw new Error("관리자 인증 결과가 올바르지 않습니다.");
                }

                // 4. 로그인 화면을 관리자 화면으로 전환
                loginForm.style.display = "none";
                adminPanel.style.display = "block";
                document.body.classList.add("admin-active");

                loginMessage.textContent =
                    "관리자 로그인 및 권한 확인에 성공했습니다.";

            } catch (error) {

                adminAccessToken = null;

                loginMessage.textContent =
                    "오류: " + error.message;

            } finally {

                passwordInput.value = "";
                loginButton.disabled = false;

            }
        });

        // 로그아웃
        logoutButton.addEventListener("click", function () {

            adminAccessToken = null;
            pendingDraftToken = null;
            document.getElementById("draftPreview").hidden = true;
            document.getElementById("saveDraftButton").disabled = true;
            document.getElementById("draftStatus").textContent = "아직 생성된 기사가 없습니다.";
            document.getElementById("savedArticleLink").replaceChildren();
            document.body.classList.remove("admin-active");

            loginForm.style.display = "block";
            adminPanel.style.display = "none";

            loginMessage.textContent = "로그아웃했습니다.";

        });

        // 서버에서 생성한 기사를 미리보기 화면에 표시
        function showDraft(news) {
            document.getElementById("draftTitle").textContent = news.title;
            document.getElementById("draftLead").textContent = news.lead;
            document.getElementById("draftBody").textContent = news.body;
            document.getElementById("draftNotice").textContent = news.scope_notice;
            document.getElementById("draftRetrievedAt").textContent =
                "조회 완료: " + new Date(news.retrieved_at).toLocaleString(
                    "ko-KR", {timeZone: "Asia/Seoul"}
                ) + " (KST)";

            const routeTable = document.getElementById("draftRoutes");
            routeTable.replaceChildren();
            news.routes.forEach(function (route) {
                const row = document.createElement("tr");
                const ratio = route.congested_distance_m / route.distance_m * 100;
                const values = [
                    route.start + " → " + route.end,
                    (route.distance_m / 1000).toFixed(2),
                    route.duration_seconds == null
                        ? "정보 없음"
                        : (route.duration_seconds / 60).toFixed(1),
                    ratio.toFixed(1) + "%"
                ];
                values.forEach(function (value) {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });
                routeTable.appendChild(row);
            });
            document.getElementById("draftPreview").hidden = false;
        }

        // 관리자 로그인 후 새 기사 생성
        document.getElementById("generateDraftButton").addEventListener(
            "click", async function () {
                const generateButton = this;
                const saveButton = document.getElementById("saveDraftButton");
                const status = document.getElementById("draftStatus");
                pendingDraftToken = null;
                saveButton.disabled = true;
                generateButton.disabled = true;
                document.getElementById("draftPreview").hidden = true;
                document.getElementById("savedArticleLink").replaceChildren();
                status.textContent = "교통정보 3개 경로를 조회하는 중입니다.";

                try {
                    const response = await fetch("/api/admin/news/generate", {
                        method: "POST",
                        headers: {"Authorization": "Bearer " + adminAccessToken}
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.detail || "기사 생성에 실패했습니다.");
                    }
                    pendingDraftToken = data.draft_token;
                    showDraft(data.news);
                    saveButton.disabled = false;
                    status.textContent = "미리보기 확인 후 저장하세요. 저장 가능 시간: 약 "
                        + Math.round(data.expires_in / 60) + "분";
                } catch (error) {
                    status.textContent = "오류: " + error.message;
                } finally {
                    generateButton.disabled = false;
                }
            }
        );

        // 미리보기와 동일한 기사를 서버에서 검증 후 저장
        document.getElementById("saveDraftButton").addEventListener(
            "click", async function () {
                if (!pendingDraftToken || !adminAccessToken) {
                    return;
                }
                const saveButton = this;
                const status = document.getElementById("draftStatus");
                saveButton.disabled = true;
                status.textContent = "뉴스를 Supabase에 저장하는 중입니다.";

                try {
                    const response = await fetch("/api/admin/news/save", {
                        method: "POST",
                        headers: {
                            "Authorization": "Bearer " + adminAccessToken,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({draft_token: pendingDraftToken})
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.detail || "저장에 실패했습니다.");
                    }
                    status.textContent = data.already_saved
                        ? "이미 저장된 뉴스입니다. 기사 #" + data.article_id
                        : "저장 완료! 기사 #" + data.article_id;
                    const link = document.createElement("a");
                    link.href = "/api/news/history/" + data.article_id;
                    link.textContent = "저장된 기사 확인 (기사 #" + data.article_id + ")";
                    document.getElementById("savedArticleLink").replaceChildren(link);
                    // 저장 성공 후 동일 기사의 추가 클릭은 비활성화
                    pendingDraftToken = null;
                } catch (error) {
                    status.textContent = "오류: " + error.message;
                    // 재시도 시 서버의 중복 차단이 동일 generation_id를 보호
                    saveButton.disabled = false;
                }
            }
        );

    </script>
</body>
</html>
