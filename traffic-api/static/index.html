<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>서울 도로교통 브리핑 | 카카오 경로 조회</title>
    <style>
        body { margin: 0; font-family: Arial, "Noto Sans KR", sans-serif; background: #f5f7fb; color: #172033; }
        header { background: #182437; color: white; padding: 28px 22px; }
        header h1 { margin: 0 0 8px; }
        header p { margin: 0; color: #cbd5e1; }
        main { max-width: 980px; margin: 28px auto; padding: 0 18px; }
        section { background: white; padding: 22px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 3px 14px #1824370d; }
        form { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
        label { display: block; font-weight: bold; margin-bottom: 7px; }
        .field { flex: 1; min-width: 190px; }
        input { box-sizing: border-box; padding: 12px; width: 100%; border: 1px solid #cbd5e1; border-radius: 7px; }
        button, .link { padding: 12px 18px; border: none; border-radius: 7px; background: #2563eb; color: white; cursor: pointer; text-decoration: none; display: inline-block; }
        .link { background: #047857; margin-top: 14px; }
        #message { margin-top: 14px; color: #b42318; }
        .muted { color: #64748b; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f1f5f9; }
        .scroll { overflow-x: auto; }
    </style>
</head>
<body>
<header>
    <h1>서울 도로교통 브리핑</h1>
    <p>카카오 장소 검색 · 자동차 경로별 교통정보</p>
</header>
<main>
    <section>
        <h2>출발지와 목적지 검색</h2>
        <form id="routeForm">
            <div class="field"><label for="origin">출발지</label><input id="origin" value="서울역" required minlength="2"></div>
            <div class="field"><label for="destination">목적지</label><input id="destination" value="잠실역" required minlength="2"></div>
            <button id="submitButton" type="submit">경로 조회</button>
        </form>
        <p id="message" role="status"></p>
        <a class="link" href="/map">지도에서 경로 보기</a>
    </section>
    <section>
        <h2>경로 요약</h2>
        <p id="summary" class="muted">조회 버튼을 눌러주세요.</p>
        <p class="muted">※ 경로의 교통정보이며 서울 전체 교통 현황을 대표하지 않습니다.</p>
    </section>
    
<section>
    <h2>서울 교통 브리핑</h2>

    <h3 id="briefingTitle">
        경로를 조회하면 브리핑이 표시됩니다.
    </h3>

    <p id="briefingContent">
        아직 생성된 교통 브리핑이 없습니다.
    </p>

    <p class="muted">
        카카오 자동차 경로 정보를 바탕으로 작성된
        데이터 기반 브리핑입니다.
    </p>
</section>

    <section>
        <h2>도로 구간별 교통정보</h2>
        <div class="scroll">
            <table>
                <thead><tr><th>도로명</th><th>구간 거리</th><th>통행속도</th><th>교통 상태</th></tr></thead>
                <tbody id="roadRows"><tr><td colspan="4">조회 결과 없음</td></tr></tbody>
            </table>
        </div>
    </section>
</main>
<script>
    const routeForm = document.getElementById("routeForm");
    const message = document.getElementById("message");
    const summary = document.getElementById("summary");
    const roadRows = document.getElementById("roadRows");
    const submitButton = document.getElementById("submitButton");
    const briefingTitle = document.getElementById("briefingTitle");
    const briefingContent = document.getElementById("briefingContent");

    function displayNumber(value, unit) {
        return value === null || value === undefined ? "정보 없음" : value + " " + unit;
    }

    routeForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        message.textContent = "카카오 교통정보를 조회하고 있습니다.";
        submitButton.disabled = true;
        try {
            const origin = document.getElementById("origin").value.trim();
            const destination = document.getElementById("destination").value.trim();
            const parameters = new URLSearchParams({ origin: origin, destination: destination });
            const response = await fetch("/api/route?" + parameters.toString());
            const data = await response.json();
            if (!response.ok) {
                throw new Error(typeof data.detail === "string" ? data.detail : "경로 조회 실패");
            }
            const distance = data.total_distance_m === null ? "정보 없음" : (data.total_distance_m / 1000).toFixed(2) + " km";
            const duration = data.total_duration_seconds === null ? "정보 없음" : (data.total_duration_seconds / 60).toFixed(1) + " 분";
            summary.textContent = data.origin.name + " → " + data.destination.name + " | 거리: " + distance + " | 예상 시간: " + duration;
            roadRows.replaceChildren();
            data.roads.forEach(function (road) {
                const row = document.createElement("tr");
                const values = [
                    road.name,
                    displayNumber(road.distance_m, "m"),
                    displayNumber(road.traffic_speed_kmh, "km/h"),
                    road.traffic_status || "정보 없음"
                ];
                values.forEach(function (value) {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });
                roadRows.appendChild(row);
            });
            if (data.roads.length === 0) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");
                cell.colSpan = 4;
                cell.textContent = "세부 구간 정보가 제공되지 않았습니다.";
                row.appendChild(cell);
                roadRows.appendChild(row);
            }
            
if (data.briefing) {
    briefingTitle.textContent = data.briefing.title;
    briefingContent.textContent = data.briefing.content;
}

            message.textContent = "";
        } catch (error) {
            message.textContent = "오류: " + error.message;
        } finally {
            submitButton.disabled = false;
        }
    });
</script>
</body>
</html>
